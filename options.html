<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Wayback Auto Archiver 設定</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; font-size: 14px; line-height: 1.7; }
  textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
  input[type="number"] { width: 80px; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  .hint { color: #666; font-weight: 400; font-size: 12.5px; }
  button { margin-top: 18px; padding: 8px 20px; cursor: pointer; }
  #saved { color: #2b6cb0; margin-left: 10px; }
</style></head>
<body>
  <h1>Wayback Auto Archiver 設定</h1>

  <label>同じURLを再保存しない期間（時間）
    <div><input type="number" id="dedupeHours" min="0" max="720"> <span class="hint">0 = 毎回保存（Waybackの負荷が上がるので非推奨）</span></div>
  </label>

  <label>保存リクエストの最小間隔（秒）
    <div><input type="number" id="minIntervalSec" min="4" max="120"> <span class="hint">Waybackの上限は約15件/分。8秒 = 最大7.5件/分</span></div>
  </label>

  <label><span><input type="checkbox" id="stripTracking"> トラッキングパラメータ（utm_* / fbclid等）を除去して保存</span></label>
  <label><span><input type="checkbox" id="skipSensitiveQuery"> token / session / password等を含むURLは保存しない</span></label>

  <label>除外ホスト（1行に1つ）
    <div class="hint">例: example.com と書くとサブドメイン含め除外。*.example.com も可。銀行・Webメール等、URL自体を外に出したくない先をここへ。</div>
    <textarea id="excludeHosts" rows="8"></textarea>
  </label>

  <label>除外パターン（URLに含まれたら除外、1行に1つ）
    <textarea id="excludePatterns" rows="4"></textarea>
  </label>

  <div>
    <button id="save">保存</button><span id="saved"></span>
    <button id="clear" style="margin-left:16px">履歴と重複記録をクリア</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
